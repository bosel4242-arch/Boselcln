<style>
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<meta name="description" content="Bikin gambar dari teks dan ubah jadi video pendek, langsung di HP.">
<title>Youdown AI - Gambar dan Video AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0c0f'/%3E%3Crect x='20' y='20' width='24' height='24' rx='5' transform='rotate(45 32 32)' fill='%238be3ff'/%3E%3C/svg%3E">
<style>
  :root{color-scheme:dark;--bg:#0c0c0f;--p1:#17171c;--p2:#202027;--ink:#fff;--muted:#9a9aa6;--line:#2a2a33;--g1:#8be3ff;--g2:#c08bff;--err:#ff8a80}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.45}
  .app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(92px + env(safe-area-inset-bottom,0px))}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--g1);outline-offset:2px}
  .view{display:none}.view.on{display:block}
  svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .logo{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
  .logo i{display:inline-block;width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,var(--g1),var(--g2));margin-right:8px;transform:rotate(45deg)}
  .right{display:flex;align-items:center;gap:8px}
  .pill{padding:8px 14px;font-size:.88rem;background:var(--p1);border:1px solid var(--line);border-radius:999px}
  .pill b{background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .icon-btn{display:grid;place-items:center;width:38px;height:38px;padding:0;background:var(--p1);border:1px solid var(--line);border-radius:50%}
  .icon-btn svg{width:20px;height:20px}
  h1{font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.08;letter-spacing:-.04em;margin:0 0 8px}
  .lead{color:var(--muted);margin:0 0 20px}
  h2{font-size:1.05rem;margin:26px 0 12px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:132px;padding:16px;text-align:left;font-size:1.1rem;font-weight:700;border:0;border-radius:24px;background:linear-gradient(160deg,#2a6f86,#2c3f78)}
  .tile.alt{background:linear-gradient(160deg,#5a3f9a,#2c3f78)}
  .tile small{display:block;font-weight:400;font-size:.82rem;opacity:.8}
  .tile .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#0c0c0f}

  .ex{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{position:relative;aspect-ratio:4/5;padding:0;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:20px;background:var(--bg)}
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card .sh{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.82))}
  .card .tx{position:absolute;left:0;right:0;bottom:0;padding:12px;font-size:.84rem;line-height:1.35}
  .card .tx b{display:inline-block;margin-bottom:5px;padding:2px 9px;font-size:.72rem;color:#0c0c0f;background:var(--g1);border-radius:999px}

  .back{display:flex;align-items:center;gap:6px;margin-bottom:14px;padding:0;background:none;border:0;font-weight:700;font-size:1.1rem}
  .panel{background:var(--p1);border:1px solid var(--line);border-radius:22px;padding:14px}
  textarea,input[type=text],input[type=password]{width:100%;padding:14px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:16px}
  textarea{min-height:110px;resize:vertical}
  .meta{display:flex;justify-content:space-between;margin:6px 2px 4px;color:var(--muted);font-size:.85rem}
  .meta button{background:none;border:0;color:var(--g1);padding:0}
  .lbl{font-weight:600;margin:16px 0 8px}
  .hint{margin:6px 2px 0;color:var(--muted);font-size:.82rem}
  .opts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .opts::-webkit-scrollbar{display:none}
  .opt{flex:none;padding:9px 16px;font-size:.92rem;font-weight:600;color:var(--muted);background:var(--p2);border:0;border-radius:999px}
  .opt[aria-pressed="true"]{color:#0c0c0f;background:linear-gradient(135deg,var(--g1),var(--g2))}
  .go{width:100%;margin-top:18px;padding:16px;font-size:1.05rem;font-weight:800;color:#0c0c0f;background:linear-gradient(135deg,var(--g1),var(--g2));border:0;border-radius:16px}
  .go:disabled{opacity:.55;cursor:not-allowed}
  .ghost{width:100%;margin-top:10px;padding:13px;font-weight:700;background:var(--p2);border:1px solid var(--line);border-radius:14px}
  .msg{min-height:1.4em;margin:12px 2px 0;color:var(--muted);font-size:.95rem}
  .msg.err{color:var(--err)}
  .stage{display:none;margin-top:14px}
  .frame{position:relative;width:100%;min-height:120px;background:var(--p1);border:1px solid var(--line);border-radius:22px;overflow:hidden}
  .frame img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  .frame img.on{opacity:1}
  .shim{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;color:var(--muted);background:linear-gradient(110deg,var(--p1) 30%,var(--p2) 50%,var(--p1) 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
  .shim.bad{animation:none;background:var(--p1);color:var(--err)}
  @keyframes sh{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.shim{animation:none}.frame img{transition:none}}
  .acts{display:flex;gap:10px;margin-top:10px}
  .acts button,.acts a{flex:1;padding:14px 8px;text-align:center;font-weight:700;color:var(--ink);text-decoration:none;background:var(--p2);border:1px solid var(--line);border-radius:14px}
  .acts .main{color:#0c0c0f;background:var(--g1);border-color:var(--g1)}
  .thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .thumbs button{flex:none;width:68px;height:68px;padding:0;overflow:hidden;background:var(--p2);border:2px solid transparent;border-radius:14px}
  .thumbs button[aria-pressed="true"]{border-color:var(--g1)}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  video{display:block;width:100%;margin-top:14px;border-radius:20px;background:#000}
  .bar{display:none;height:6px;margin-top:12px;overflow:hidden;background:var(--p2);border-radius:99px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2))}
  .gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cell{position:relative;aspect-ratio:1;overflow:hidden;background:var(--p1);border:1px solid var(--line);border-radius:18px}
  .cell .open{display:block;width:100%;height:100%;padding:0;background:none;border:0}
  .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .cell .del{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:32px;height:32px;padding:0;background:rgba(12,12,15,.78);border:0;border-radius:50%}
  .cell .del svg{width:16px;height:16px}
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}
  .note{margin-top:26px;color:var(--muted);font-size:.8rem}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:rgba(12,12,15,.95);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav div{display:flex;width:100%;max-width:560px}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:.76rem;color:var(--muted);background:none;border:0}
  nav button[aria-current="page"]{color:var(--ink)}
  nav button[aria-current="page"] svg{stroke:var(--g1)}
</style>
</head>
<body>

<div class="app">
  <!-- BERANDA -->
