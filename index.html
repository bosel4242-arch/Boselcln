<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KlipKilat AI - Auto Video Clipper</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<!-- Midtrans Snap (client key publik, aman di frontend). Untuk sandbox: app.sandbox.midtrans.com + client key SB-... -->

<style>
body{background:#090d16;background-image:radial-gradient(at 10% 10%,rgba(59,130,246,.08),transparent 50%),radial-gradient(at 90% 15%,rgba(244,63,94,.08),transparent 50%);background-attachment:fixed}
</style>
</head>
<body class="text-slate-100 antialiased">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ====== KONFIGURASI ======
// GANTI dengan URL backend Render kamu, tanpa garis miring di akhir. Contoh: 'https://klipkilat-api.onrender.com'
const API_BASE = '';

const PLANS = { semi_annual: { name: '6 Bulan', price: 15000 }, annual: { name: '1 Tahun', price: 25000 } };
const YT_RE = /^https?:\/\/(www\.|m\.)?(youtube\.com\/(watch\?v=|shorts\/|live\/)|youtu\.be\/)[\w-]{6,}/;

function useLS(key, def) {
  const [v, setV] = useState(() => { try { const x = localStorage.getItem(key); return x ? JSON.parse(x) : def; } catch (e) { return def; } });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }, [v]);
  return [v, setV];
}
const rp = (n) => 'Rp ' + n.toLocaleString('id-ID');
const boom = (n = 70) => window.confetti && window.confetti({ particleCount: n, spread: 70, origin: { y: 0.6 } });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function App() {
  const [mode, setMode] = useState('layout');
  const [notice, setNotice] = useState('');
  const [layout, setLayout] = useLS('kk_layout', 'split');
  const [hook, setHook] = useLS('kk_hook', 'JANGAN SKIP! MOMEN PALING GAK MASUK AKAL 🔥');
  const [channel, setChannel] = useLS('kk_channel', '@KlipViralID');
  const [badge, setBadge] = useLS('kk_badge', true);
  const [count, setCount] = useState(3);
  const [url, setUrl] = useState('');
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState('');
  const [clips, setClips] = useState([]);
  const [plan, setPlan] = useState('semi_annual');
  const [payOpen, setPayOpen] = useState(false);
  const [paying, setPaying] = useState(false);
  const [orderId, setOrderId] = useLS('kk_order', '');
  const [subscribed, setSubscribed] = useState(false);

  const toast = (m) => { setNotice(m); setTimeout(() => setNotice(''), 4000); };
  const api = (p, o = {}) => fetch(API_BASE + p, { ...o, headers: { 'Content-Type': 'application/json', 'X-Order-Id': orderId, ...(o.headers || {}) } });

  // Cek status langganan ke server (bukan hanya dari perangkat)
  async function checkSub(id = orderId) {
    if (!API_BASE || !id) return false;
    try { const d = await (await fetch(API_BASE + '/api/status/' + id)).json(); setSubscribed(!!d.active); return !!d.active; } catch (e) { return false; }
  }
  useEffect(() => { checkSub(); }, []);

  async function generate(e) {
    e.preventDefault();
    if (!API_BASE) return toast('Backend belum diatur: isi API_BASE di index.html dengan URL server kamu.');
    if (!YT_RE.test(url.trim())) return toast('Masukkan link YouTube yang valid.');
    setBusy(true); setClips([]); setStatus('Mengunduh & memotong video, bisa beberapa menit...');
    try {
      const r = await api('/api/clip', { method: 'POST', body: JSON.stringify({ url: url.trim(), count }) });
      if (!r.ok) throw new Error('Server error ' + r.status);
      const { job_id, paid } = await r.json();
      if (!paid) toast('Akun gratis: 1 klip. Aktifkan All Access untuk 3-5 klip & download.');
      for (let i = 0; i < 200; i++) {
        await sleep(4000);
        const j = await (await fetch(API_BASE + '/api/job/' + job_id)).json();
        if (j.status === 'done') { setClips(j.clips); toast('Klip selesai dibuat!'); boom(); break; }
        if (j.status === 'error') throw new Error(j.error || 'gagal');
      }
    } catch (err) { toast('Gagal memproses: ' + err.message); }
    setBusy(false); setStatus('');
  }

  async function download(c) {
    if (!subscribed) { setPayOpen(true); return toast('Download butuh All Access.'); }
    try {
      const r = await api('/api/download/' + c.file);
      if (!r.ok) throw new Error('Server ' + r.status);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await r.blob()); a.download = 'klipkilat-' + c.file; a.click();
    } catch (err) { toast('Download gagal: ' + err.message); }
  }

  async function pay() {
    if (!API_BASE) return toast('Backend belum diatur (API_BASE kosong).');
    if (!window.snap) return toast('Midtrans Snap gagal dimuat. Cek koneksi/ad-blocker.');
    setPaying(true);
    try {
      const r = await fetch(API_BASE + '/api/create-transaction', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan }) });
      const d = await r.json();
      if (!d.token) throw new Error(d.detail || 'Token tidak diterima');
      setOrderId(d.order_id);
      window.snap.pay(d.token, {
        onSuccess: async () => {
          toast('Memverifikasi pembayaran...');
          for (let i = 0; i < 10; i++) { if (await checkSub(d.order_id)) { setPayOpen(false); toast('Pembayaran berhasil! All Access aktif.'); boom(90); return; } await sleep(2000); }
          toast('Pembayaran diterima, aktivasi menunggu konfirmasi Midtrans. Refresh sebentar lagi.');
        },
        onPending: () => toast('Menunggu pembayaran diselesaikan. Setelah bayar, refresh halaman.'),
        onError: () => toast('Pembayaran gagal, coba lagi.'),
        onClose: () => setPaying(false),
      });
    } catch (err) { toast('Gagal memulai pembayaran: ' + err.message); }
    setPaying(false);
  }

  const card = 'bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-2xl';
  const inp = 'w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500';

  return (
    <div className="min-h-screen flex flex-col font-sans">
      <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800">
        <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
          <h1 className="font-extrabold text-lg">✂️ KlipKilat<span className="text-blue-500">.AI</span></h1>
          <button onClick={() => setPayOpen(true)} className={`px-3 py-2 text-xs font-bold rounded-xl whitespace-nowrap ${subscribed ? 'bg-emerald-500/10 border border-emerald-500/40 text-emerald-300' : 'bg-gradient-to-r from-blue-600 to-rose-600 text-white'}`}>
            {subscribed ? '👑 ALL ACCESS AKTIF' : '👑 Akses 15K / 25K'}
          </button>
        </div>
      </header>

      <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
        {notice && <div className="p-3 bg-emerald-950/80 border border-emerald-500/50 text-emerald-200 rounded-xl text-xs font-semibold">✅ {notice}</div>}

        <div className={card + ' space-y-3'}>
          <div className="flex flex-wrap gap-2 items-center">
            {[['layout', '🎥 Tata Letak'], ['logo', '🛡️ Logo & Channel'], ['hook', '✨ Judul Hook']].map(([k, l]) =>
              <button key={k} onClick={() => setMode(k)} className={`px-4 py-2 rounded-xl font-bold text-xs ${mode === k ? 'bg-blue-600' : 'bg-slate-800 text-slate-300'}`}>{l}</button>)}
          </div>
          {mode === 'layout' && <div className="flex gap-2 text-xs items-center"><span className="text-slate-400">Preset:</span>
            {[['split', 'Cam + Gameplay'], ['full', 'Layar Penuh']].map(([k, l]) => <button key={k} onClick={() => setLayout(k)} className={`px-3 py-1.5 rounded-lg border ${layout === k ? 'border-blue-500 text-blue-300' : 'border-slate-700 text-slate-400'}`}>{l}</button>)}</div>}
          {mode === 'logo' && <div className="flex flex-wrap gap-3 items-center text-xs">
            <input className={inp + ' max-w-xs'} value={channel} onChange={(e) => setChannel(e.target.value)} placeholder="@NamaChannel" />
            <label className="flex items-center gap-2"><input type="checkbox" checked={badge} onChange={(e) => setBadge(e.target.checked)} /> Centang biru</label></div>}
          {mode === 'hook' && <input className={inp} value={hook} onChange={(e) => setHook(e.target.value)} />}
          <p className="text-[11px] text-slate-500">Pengaturan tersimpan otomatis di perangkat ini. Pratinjau tampilan saja; hasil klip dari server berupa video vertikal 9:16 polos.</p>
        </div>

        <div className="grid lg:grid-cols-2 gap-6 items-start">
          <div className={card + ' flex flex-col items-center'}>
            <h3 className="font-extrabold text-sm uppercase mb-3 self-start">🎥 Pratinjau 9:16</h3>
            <div className="w-[260px] h-[460px] bg-slate-950 rounded-[32px] p-2 border-4 border-slate-800 flex flex-col gap-1">
              <div className="bg-gradient-to-r from-red-600 to-amber-500 text-white font-black text-[11px] uppercase py-1.5 px-2 rounded-xl text-center mt-2">{hook}</div>
              <div className="flex-1 bg-black rounded-xl flex items-center justify-center text-[10px] font-bold text-slate-500">VIDEO</div>
              {layout === 'split' && <div className="flex-1 bg-slate-800 rounded-xl flex items-center justify-center text-[10px] font-bold text-slate-400">GAMEPLAY</div>}
              <div className="bg-slate-900 px-3 py-1.5 rounded-xl flex items-center justify-between text-[11px] font-black">
                <span>{channel} {badge && <span className="bg-sky-500 rounded-full px-1 text-[9px]">✓</span>}</span><span className="text-amber-300 text-[9px]">9:16</span>
              </div>
            </div>
          </div>

          <form onSubmit={generate} className={card + ' space-y-4'}>
            <p className="text-xs text-slate-300">Tempel link YouTube, sistem memotong jadi klip vertikal 9:16.</p>
            <input type="url" className={inp} value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://www.youtube.com/watch?v=..." />
            <div className="grid grid-cols-3 gap-2">
              {[3, 4, 5].map((n) => <button type="button" key={n} onClick={() => setCount(n)} className={`py-2 rounded-xl text-xs font-black ${count === n ? 'bg-blue-600' : 'bg-slate-950 border border-slate-800 text-slate-400'}`}>{n} Video</button>)}
            </div>
            <button disabled={busy} className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-rose-600 disabled:opacity-50 font-black text-sm rounded-2xl">
              {busy ? '⏳ Memproses...' : `✨ GENERATE ${count} VIDEO SHORTS`}
            </button>
            {status && <p className="text-[11px] text-blue-300">{status}</p>}
            {!API_BASE && <p className="text-[11px] text-amber-300">API_BASE belum diisi, belum bisa memproses.</p>}
          </form>
        </div>

        {clips.length > 0 && <div className={card + ' space-y-3'}>
          <h3 className="font-black">Hasil ({clips.length} klip)</h3>
          <div className="grid md:grid-cols-3 gap-4">
            {clips.map((c) => <div key={c.id} className="p-4 rounded-2xl border border-slate-800 bg-slate-950 space-y-2">
              <div className="text-[11px] font-black text-blue-400">Klip #{c.id} · {c.duration} dtk</div>
              <button onClick={() => download(c)} className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-xl">⬇️ Download MP4</button>
            </div>)}
          </div>
        </div>}
      </main>

      {payOpen && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85" onClick={() => setPayOpen(false)}>
        <div className="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-6 space-y-4" onClick={(e) => e.stopPropagation()}>
          <div className="flex justify-between items-center"><b>👑 All Access</b><button onClick={() => setPayOpen(false)} className="text-slate-400 text-lg">✕</button></div>
          {subscribed ? <p className="text-sm text-emerald-300">All Access aktif.</p> : <>
            <div className="grid grid-cols-2 gap-3">
              {Object.entries(PLANS).map(([k, p]) => <button key={k} onClick={() => setPlan(k)} className={`p-3 rounded-2xl border-2 text-left ${plan === k ? 'border-blue-500 bg-blue-950/60' : 'border-slate-700'}`}>
                <div className="text-xs font-bold text-blue-300">{p.name}</div><div className="text-xl font-black">{rp(p.price)}</div></button>)}
            </div>
            <button onClick={pay} disabled={paying} className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-black text-sm rounded-xl">{paying ? 'Membuka pembayaran...' : `Bayar ${rp(PLANS[plan].price)} (QRIS, VA, E-Wallet)`}</button>
          </>}
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
