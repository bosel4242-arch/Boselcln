<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KlipKilat AI - Auto Video Clipper</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<!-- Snap Midtrans (client key publik, aman di frontend) -->
<script src="https://app.midtrans.com/snap/snap.js" data-client-key="Mid-client-iW_dcoophsEsGKZp"></script>
<style>
body{background:#090d16;background-image:radial-gradient(at 10% 10%,rgba(59,130,246,.08),transparent 50%),radial-gradient(at 90% 15%,rgba(244,63,94,.08),transparent 50%);background-attachment:fixed}
</style>
</head>
<body class="text-slate-100 antialiased">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ====== KONFIGURASI ======
// Isi dengan URL backend kamu (mis. server di Render). Kosong = mode DEMO.
// Endpoint yang dibutuhkan:
//  POST {API_BASE}/api/clip               body {url,lang,minScore,count} -> {clips:[{id,title,duration,viralScore,hookText}]}
//  POST {API_BASE}/api/create-transaction body {plan}                    -> {token}  (token Snap dibuat pakai Server Key di backend)
const API_BASE = '';

const PLANS = { semi_annual: { name: '6 Bulan', price: 15000 }, annual: { name: '1 Tahun', price: 25000 } };
const DEMO_CLIPS = [
  { id: 1, title: 'Detik-detik kaget kena jumpscare', duration: 33, viralScore: 97, hookText: 'JANGAN PAKAI HEADSET! Reaksi paling heboh...' },
  { id: 2, title: 'Momen savage balas komentar hater', duration: 36, viralScore: 92, hookText: 'Dinyinyirin, dibalas fakta menyakitkan!' },
  { id: 3, title: 'Plot twist menang di detik terakhir', duration: 42, viralScore: 95, hookText: 'Udah pasrah mau surrender, tapi tiba-tiba...' },
  { id: 4, title: 'Rahasia algoritma FYP 2026', duration: 39, viralScore: 93, hookText: 'Ternyata algoritma sekarang gak peduli hashtag...' },
  { id: 5, title: 'Curhat soal masa lalu dihina tetangga', duration: 45, viralScore: 91, hookText: 'Dulu dianggap pengangguran, sekarang...' },
];
const TRENDS = [
  { id: 'a', cat: 'GAMING', up: '+420% / 12 jam', title: 'Game horor indie & reaksi jumpscare', hook: 'JANGAN PAKAI HEADSET! Reaksi paling heboh semalam... 🔥' },
  { id: 'b', cat: 'PODCAST', up: '+285% / 24 jam', title: 'Gaji & penghasilan kreator 2026', hook: 'Ternyata segini penghasilan asli kreator... Jangan kaget! 😱' },
];
const YT_RE = /^https?:\/\/(www\.|m\.)?(youtube\.com\/(watch\?v=|shorts\/|live\/)|youtu\.be\/)[\w-]{6,}/;

function useLS(key, def) {
  const [v, setV] = useState(() => { try { const x = localStorage.getItem(key); return x ? JSON.parse(x) : def; } catch (e) { return def; } });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }, [v]);
  return [v, setV];
}
const rp = (n) => 'Rp ' + n.toLocaleString('id-ID');
const boom = (n = 70) => window.confetti && window.confetti({ particleCount: n, spread: 70, origin: { y: 0.6 } });

function App() {
  const [tab, setTab] = useState('workspace');
  const [mode, setMode] = useState('layout');
  const [notice, setNotice] = useState('');
  const [templateName, setTemplateName] = useLS('kk_tpl', 'Video short');
  const [layout, setLayout] = useLS('kk_layout', 'split');
  const [hook, setHook] = useLS('kk_hook', 'JANGAN SKIP! MOMEN PALING GAK MASUK AKAL 🔥');
  const [channel, setChannel] = useLS('kk_channel', '@KlipViralID');
  const [badge, setBadge] = useLS('kk_badge', true);
  const [lang, setLang] = useState('id');
  const [minScore, setMinScore] = useState(85);
  const [count, setCount] = useState(3);
  const [url, setUrl] = useState('');
  const [busy, setBusy] = useState(false);
  const [clips, setClips] = useState([]);
  const [isDemo, setIsDemo] = useState(false);
  const [trim, setTrim] = useState([15, 48]);
  const [plan, setPlan] = useState('semi_annual');
  const [payOpen, setPayOpen] = useState(false);
  const [paying, setPaying] = useState(false);
  const [subscribed, setSubscribed] = useLS('kk_allaccess', false);

  const toast = (m) => { setNotice(m); setTimeout(() => setNotice(''), 3500); };

  async function generate(e) {
    e.preventDefault();
    if (!YT_RE.test(url.trim())) return toast('Masukkan link YouTube yang valid (youtube.com / youtu.be).');
    setBusy(true); setClips([]);
    try {
      if (API_BASE) {
        const r = await fetch(API_BASE + '/api/clip', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url.trim(), lang, minScore, count }) });
        if (!r.ok) throw new Error('Server error ' + r.status);
        const d = await r.json();
        setClips(d.clips || []); setIsDemo(false);
      } else {
        await new Promise((res) => setTimeout(res, 1800));
        setClips(DEMO_CLIPS.slice(0, count)); setIsDemo(true);
      }
      toast('Klip selesai dibuat!'); boom();
    } catch (err) {
      toast('Gagal memproses: ' + err.message);
    } finally { setBusy(false); }
  }

  async function pay() {
    if (!API_BASE) return toast('Pembayaran belum aktif: isi API_BASE dengan URL backend yang membuat token Snap.');
    if (!window.snap) return toast('Midtrans Snap gagal dimuat. Cek koneksi/ad-blocker.');
    setPaying(true);
    try {
      const r = await fetch(API_BASE + '/api/create-transaction', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan }) });
      const { token } = await r.json();
      if (!token) throw new Error('Token tidak diterima');
      window.snap.pay(token, {
        onSuccess: () => { setSubscribed(true); setPayOpen(false); toast('Pembayaran berhasil! All Access aktif.'); boom(90); },
        onPending: () => toast('Menunggu pembayaran diselesaikan.'),
        onError: () => toast('Pembayaran gagal, coba lagi.'),
        onClose: () => setPaying(false),
      });
    } catch (err) { toast('Gagal memulai pembayaran: ' + err.message); }
    setPaying(false);
  }

  const tabs = [['workspace', '📐 Generator'], ['timeline', '✂️ Timeline'], ['autopost', '🚀 Auto-Post'], ['analytics', '📊 Laporan'], ['radar', '🔥 Tren']];
  const card = 'bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-2xl';
  const inp = 'w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500';
  const Demo = () => <span className="text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded">DATA CONTOH</span>;

  return (
    <div className="min-h-screen flex flex-col font-sans">
      <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800">
        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
          <h1 className="font-extrabold text-lg">✂️ KlipKilat<span className="text-blue-500">.AI</span></h1>
          <nav className="hidden md:flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
            {tabs.map(([k, l]) => <button key={k} onClick={() => setTab(k)} className={`px-3 py-1.5 rounded-lg ${tab === k ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}>{l}</button>)}
          </nav>
          <button onClick={() => setPayOpen(true)} className={`px-3 py-2 text-xs font-bold rounded-xl whitespace-nowrap ${subscribed ? 'bg-emerald-500/10 border border-emerald-500/40 text-emerald-300' : 'bg-gradient-to-r from-blue-600 to-rose-600 text-white'}`}>
            {subscribed ? '👑 ALL ACCESS AKTIF' : '👑 Akses 15K / 25K'}
          </button>
        </div>
        <div className="md:hidden flex gap-1 border-t border-slate-800 px-2 py-2 text-[11px] overflow-x-auto bg-slate-950/95">
          {tabs.map(([k, l]) => <button key={k} onClick={() => setTab(k)} className={`py-1 px-2.5 rounded-lg font-bold whitespace-nowrap ${tab === k ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>{l}</button>)}
        </div>
      </header>

      <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
        {notice && <div className="p-3 bg-emerald-950/80 border border-emerald-500/50 text-emerald-200 rounded-xl text-xs font-semibold">✅ {notice}</div>}

        {tab === 'workspace' && (<>
          <div className={card + ' space-y-3'}>
            <div className="flex flex-wrap gap-2 items-center">
              {[['layout', '🎥 Tata Letak'], ['logo', '🛡️ Logo & Channel'], ['hook', '✨ HookJudul']].map(([k, l]) =>
                <button key={k} onClick={() => setMode(k)} className={`px-4 py-2 rounded-xl font-bold text-xs ${mode === k ? 'bg-blue-600' : 'bg-slate-800 text-slate-300'}`}>{l}</button>)}
              <button onClick={() => toast(`Template "${templateName}" tersimpan di perangkat ini.`)} className="ml-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs rounded-xl">💾 SIMPAN</button>
            </div>
            {mode === 'layout' && <div className="flex gap-2 text-xs items-center"><span className="text-slate-400">Preset:</span>
              {[['split', 'Cam + Gameplay'], ['full', 'Layar Penuh']].map(([k, l]) => <button key={k} onClick={() => setLayout(k)} className={`px-3 py-1.5 rounded-lg border ${layout === k ? 'border-blue-500 text-blue-300' : 'border-slate-700 text-slate-400'}`}>{l}</button>)}</div>}
            {mode === 'logo' && <div className="flex flex-wrap gap-3 items-center text-xs">
              <input className={inp + ' max-w-xs'} value={channel} onChange={(e) => setChannel(e.target.value)} placeholder="@NamaChannel" />
              <label className="flex items-center gap-2"><input type="checkbox" checked={badge} onChange={(e) => setBadge(e.target.checked)} /> Centang biru</label></div>}
            {mode === 'hook' && <input className={inp} value={hook} onChange={(e) => setHook(e.target.value)} />}
            <div className="flex gap-2 items-center text-xs">
              <span className="text-slate-400">Nama template:</span>
              <input className={inp + ' max-w-[220px]'} value={templateName} onChange={(e) => setTemplateName(e.target.value)} />
            </div>
          </div>

          <div className="grid lg:grid-cols-2 gap-6 items-start">
            <div className={card + ' flex flex-col items-center'}>
              <h3 className="font-extrabold text-sm uppercase mb-3 self-start">🎥 Pratinjau 9:16</h3>
              <div className="w-[260px] h-[460px] bg-slate-950 rounded-[32px] p-2 border-4 border-slate-800 flex flex-col gap-1">
                <div className="bg-gradient-to-r from-red-600 to-amber-500 text-white font-black text-[11px] uppercase py-1.5 px-2 rounded-xl text-center mt-2">{hook}</div>
                <div className="flex-1 relative bg-black rounded-xl overflow-hidden">
                  <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" className="w-full h-full object-cover" autoPlay loop muted playsInline />
                  <span className="absolute top-1 left-1 bg-red-600 text-[9px] font-bold px-1.5 rounded">CAM</span>
                </div>
                <div className="text-center"><span className="bg-slate-950 text-yellow-400 font-black text-[11px] px-3 py-1 rounded-xl border border-yellow-400/40">"REAKSI PALING HEBOH!" 🔥</span></div>
                {layout === 'split' && <div className="flex-1 bg-slate-800 rounded-xl flex items-center justify-center text-[10px] font-bold text-slate-400">GAMEPLAY</div>}
                <div className="bg-slate-900 px-3 py-1.5 rounded-xl flex items-center justify-between text-[11px] font-black">
                  <span>{channel} {badge && <span className="bg-sky-500 rounded-full px-1 text-[9px]">✓</span>}</span><span className="text-amber-300 text-[9px]">9:16</span>
                </div>
              </div>
            </div>

            <form onSubmit={generate} className={card + ' space-y-4'}>
              <p className="text-xs text-slate-300">Tempel link YouTube panjang (maks. 3 jam), sistem memilih momen terbaik jadi video shorts vertikal.</p>
              <input type="url" className={inp} value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://www.youtube.com/watch?v=..." />
              <div className="grid sm:grid-cols-2 gap-3 text-xs">
                <select className={inp} value={lang} onChange={(e) => setLang(e.target.value)}>
                  <option value="id">🇮🇩 Subtitle Indonesia</option><option value="en">🇺🇸 English (US)</option><option value="ja">🇯🇵 Japanese</option>
                </select>
                <select className={inp} value={minScore} onChange={(e) => setMinScore(+e.target.value)}>
                  <option value={80}>Skor 80+</option><option value={85}>Skor 85+</option><option value={90}>Skor 90+</option>
                </select>
              </div>
              <div className="grid grid-cols-3 gap-2">
                {[3, 4, 5].map((n) => <button type="button" key={n} onClick={() => setCount(n)} className={`py-2 rounded-xl text-xs font-black ${count === n ? 'bg-blue-600' : 'bg-slate-950 border border-slate-800 text-slate-400'}`}>{n} Video</button>)}
              </div>
              <button disabled={busy} className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-rose-600 disabled:opacity-50 font-black text-sm rounded-2xl">
                {busy ? '⏳ Memproses...' : `✨ GENERATE ${count} VIDEO SHORTS`}
              </button>
              {!API_BASE && <p className="text-[11px] text-amber-300">Mode demo: backend belum diatur, hasil di bawah hanya contoh.</p>}
            </form>
          </div>

          {clips.length > 0 && <div className={card + ' space-y-3'}>
            <div className="flex items-center gap-2"><h3 className="font-black">Hasil ({clips.length} klip)</h3>{isDemo && <Demo />}</div>
            <div className="grid md:grid-cols-3 gap-4">
              {clips.map((c, i) => <div key={c.id} className="p-4 rounded-2xl border border-slate-800 bg-slate-950 space-y-2">
                <div className="flex justify-between text-[11px] font-black"><span className="text-blue-400">Klip #{i + 1}</span><span className="bg-amber-400 text-slate-950 px-2 rounded">🔥 {c.viralScore}</span></div>
                <h4 className="text-xs font-bold">{c.title}</h4>
                <p className="text-[11px] text-slate-400 italic">"{c.hookText}"</p>
                <div className="flex justify-between items-center text-[11px] text-slate-400"><span>{c.duration} dtk</span>
                  <button onClick={() => { setHook(c.hookText); toast('Hook dipasang ke pratinjau.'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="text-emerald-400 font-bold">Pakai hook</button></div>
              </div>)}
            </div>
          </div>}
        </>)}

        {tab === 'timeline' && <div className={card + ' space-y-4'}>
          <h3 className="text-lg font-black">✂️ Editor Timeline</h3>
          <p className="text-xs text-slate-400">Atur titik mulai & akhir klip (video contoh 1 menit).</p>
          {[['Mulai', 0], ['Selesai', 1]].map(([l, i]) => <label key={l} className="block text-xs">
            {l}: <b className="font-mono">{trim[i]} dtk</b>
            <input type="range" min="0" max="60" value={trim[i]} className="w-full accent-rose-500"
              onChange={(e) => { const v = +e.target.value; setTrim(i === 0 ? [Math.min(v, trim[1] - 5), trim[1]] : [trim[0], Math.max(v, trim[0] + 5)]); }} />
          </label>)}
          <div className="text-xs font-mono text-rose-400">Durasi: {trim[1] - trim[0]} detik {(trim[1] - trim[0] >= 15 && trim[1] - trim[0] <= 60) ? '(cocok untuk Shorts)' : '(ideal 15–60 dtk)'}</div>
          <button onClick={() => { setTab('autopost'); toast('Klip siap dijadwalkan.'); }} className="w-full py-3 bg-gradient-to-r from-rose-600 to-indigo-600 font-extrabold text-xs rounded-xl">🚀 JADWALKAN KLIP INI</button>
        </div>}

        {tab === 'autopost' && <div className={card + ' space-y-4'}>
          <div className="flex items-center gap-2"><h3 className="font-black">Saran Jadwal Upload</h3><Demo /></div>
          <div className="grid sm:grid-cols-3 gap-3 text-xs">
            {[['12:30', 'Klip savage & reaksi cepat'], ['19:45', 'Klip jumpscare & emosi puncak'], ['21:45', 'Klip comeback & inspirasi']].map(([t, n]) =>
              <div key={t} className="p-3 bg-slate-950 border border-indigo-500/30 rounded-xl"><div className="font-mono text-amber-400">{t} WIB</div><div className="font-bold">{n}</div></div>)}
          </div>
          <p className="text-[11px] text-slate-400">Posting otomatis ke TikTok/Reels/Shorts butuh login OAuth tiap platform di backend; belum tersedia di versi ini.</p>
        </div>}

        {tab === 'analytics' && <div className={card + ' space-y-3'}>
          <div className="flex items-center gap-2"><h3 className="font-black">Laporan Mingguan</h3><Demo /></div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
            {[['1.42M', 'Views'], ['84.3K', 'Shares'], ['78.6%', 'Retensi'], ['+14.2K', 'Followers']].map(([v, l]) =>
              <div key={l} className="p-4 bg-slate-950 rounded-2xl border border-slate-800"><div className="text-2xl font-black">{v}</div><div className="text-xs text-slate-400">{l}</div></div>)}
          </div>
        </div>}

        {tab === 'radar' && <div className={card + ' space-y-3'}>
          <div className="flex items-center gap-2"><h3 className="font-black">Radar Tren FYP</h3><Demo /></div>
          <div className="grid md:grid-cols-2 gap-4">
            {TRENDS.map((t) => <div key={t.id} className="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-2">
              <div className="flex justify-between text-xs"><b className="text-rose-400">{t.cat}</b><span className="text-emerald-400 font-mono">{t.up}</span></div>
              <h4 className="text-sm font-bold">{t.title}</h4>
              <button onClick={() => { setHook(t.hook); setTab('workspace'); toast('Hook tren diterapkan.'); }} className="w-full py-2 bg-rose-600/20 hover:bg-rose-600 border border-rose-500/40 text-xs font-bold rounded-xl">✨ Terapkan Hook</button>
            </div>)}
          </div>
        </div>}
      </main>

      {payOpen && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85" onClick={() => setPayOpen(false)}>
        <div className="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-6 space-y-4" onClick={(e) => e.stopPropagation()}>
          <div className="flex justify-between items-center"><b>👑 Semua Akses</b><button onClick={() => setPayOpen(false)} className="text-slate-400 text-lg">✕</button></div>
          {subscribed ? <p className="text-sm text-emerald-300">All Access sudah aktif di perangkat ini.</p> : <>
            <div className="grid grid-cols-2 gap-3">
              {Object.entries(PLANS).map(([k, p]) => <button key={k} onClick={() => setPlan(k)} className={`p-3 rounded-2xl border-2 text-left ${plan === k ? 'border-blue-500 bg-blue-950/60' : 'border-slate-700'}`}>
                <div className="text-xs font-bold text-blue-300">{p.name}</div><div className="text-xl font-black">{rp(p.price)}</div></button>)}
            </div>
            <button onClick={pay} disabled={paying} className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-black text-sm rounded-xl">{paying ? 'Membuka pembayaran...' : `Bayar ${rp(PLANS[plan].price)} (QRIS, VA, E-Wallet)`}</button>
            {!API_BASE && <p className="text-[11px] text-amber-300">Backend belum diatur (API_BASE kosong), jadi pembayaran belum bisa dimulai.</p>}
          </>}
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
