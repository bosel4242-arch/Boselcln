<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bosel42 - Tonton Video Terbaru</title>
<meta name="description" content="Kumpulan video terbaru, tonton langsung di YouTube dan Facebook Reels.">
<meta property="og:title" content="Tonton Video Terbaru">
<meta property="og:description" content="Kumpulan video terbaru, tonton dan ikuti channelnya.">
<meta property="og:type" content="website">
<style>
:root{--bg:#fafafa;--card:#fff;--text:#1a1a1a;--muted:#666;--accent:#e63946;--line:#e5e5e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--text:#f1f1f1;--muted:#aaa;--line:#333}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--text:#f1f1f1;--muted:#aaa;--line:#333}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
header{text-align:center;margin-bottom:24px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
h1{margin:0;font-size:22px}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{display:block;text-align:center;text-decoration:none;color:#fff;padding:14px;border-radius:12px;font-weight:600;margin-bottom:10px;border:0;width:100%;font-size:16px;cursor:pointer}
.tt{background:#111}.fb{background:#1877f2}.yt{background:#e63946}.wa{background:#25a244}
h2{font-size:17px;margin:28px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.small{flex:1;min-width:90px;text-align:center;text-decoration:none;padding:9px 10px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid var(--line);color:var(--text);background:transparent;cursor:pointer}
.small.main{background:var(--accent);color:#fff;border-color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:32px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="avatar" id="avatar">▶</div>
<h1 id="name"></h1>
<p id="bio"></p>
</header>

<a class="btn yt" id="lnkYt" target="_blank" rel="noopener">Subscribe di YouTube</a>
<a class="btn fb" id="lnkFb" target="_blank" rel="noopener">Ikuti di Facebook</a>
<a class="btn tt" id="lnkTt" target="_blank" rel="noopener">Ikuti di TikTok</a>
<a class="btn wa" id="lnkWa" target="_blank" rel="noopener">Kabari saya lewat WhatsApp</a>
<button class="btn" style="background:#444" id="shareSite">Bagikan website ini</button>

<h2 id="vidTitle">Video Terbaru</h2>
<div id="videos"></div>

<footer>Terima kasih sudah menonton!</footer>
</div>

<script>
// ===== EDIT BAGIAN INI SAJA =====
var CONFIG = {
  nama: "Bosel42",
  bio: "Video seru setiap minggu. Tonton dan ikuti ya!",
  youtube: "https://youtube.com/@bosel42",
  facebook: "https://www.facebook.com/share/1FedngTcEh/",
  tiktok: "https://www.tiktok.com/@prlvdsyafaa04",
  whatsapp: "", // isi nomor tanpa + dan tanpa 0 di depan, contoh 6281234567890
  video: [
    // Contoh isi video (hapus tanda // di depan lalu ganti):
    // {judul: "Judul Video", deskripsi: "Deskripsi singkat.", url: "https://youtube.com/watch?v=ID", reels: "", artikel: ""}
  ]
};
// =================================

function $(id){return document.getElementById(id)}
$("name").textContent = CONFIG.nama;
$("bio").textContent = CONFIG.bio;
$("avatar").textContent = CONFIG.nama.charAt(0).toUpperCase();
$("lnkYt").href = CONFIG.youtube;
$("lnkFb").href = CONFIG.facebook;
$("lnkTt").href = CONFIG.tiktok;
if (!CONFIG.whatsapp) { $("lnkWa").style.display = "none"; }
$("lnkWa").href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent("Halo, kabari saya kalau ada video baru ya!");

function shareLink(url, title){
  var text = title + " " + url;
  if (navigator.share) { navigator.share({title: title, url: url}).catch(function(){}); return; }
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
$("shareSite").onclick = function(){ shareLink(location.href, CONFIG.nama); };

if (!CONFIG.video.length) { $("vidTitle").style.display = "none"; }
var box = $("videos");
CONFIG.video.forEach(function(v){
  var c = document.createElement("div");
  c.className = "card";
  var h = document.createElement("h3"); h.textContent = v.judul;
  var p = document.createElement("p"); p.textContent = v.deskripsi;
  var r = document.createElement("div"); r.className = "row";
  var a = document.createElement("a"); a.className = "small main"; a.textContent = "Tonton"; a.href = v.url; a.target = "_blank"; a.rel = "noopener";
  r.appendChild(a);
  if (v.reels) {
    var b = document.createElement("a"); b.className = "small"; b.textContent = "Reels"; b.href = v.reels; b.target = "_blank"; b.rel = "noopener";
    r.appendChild(b);
  }
  var enc = encodeURIComponent;
  var wa = document.createElement("a"); wa.className = "small"; wa.textContent = "WhatsApp"; wa.target = "_blank"; wa.rel = "noopener";
  wa.href = "https://wa.me/?text=" + enc(v.judul + " " + v.url);
  var fb = document.createElement("a"); fb.className = "small"; fb.textContent = "Facebook"; fb.target = "_blank"; fb.rel = "noopener";
  fb.href = "https://www.facebook.com/sharer/sharer.php?u=" + enc(v.url);
  var cp = document.createElement("button"); cp.className = "small"; cp.textContent = "Salin link";
  cp.onclick = function(){
    try { navigator.clipboard.writeText(v.url); cp.textContent = "Tersalin!"; } catch(e) { cp.textContent = "Gagal"; }
    setTimeout(function(){ cp.textContent = "Salin link"; }, 1500);
  };
  r.appendChild(wa); r.appendChild(fb); r.appendChild(cp);
  c.appendChild(h); c.appendChild(p);
  if (v.artikel) {
    var ar = document.createElement("p"); ar.style.color = "var(--text)"; ar.textContent = v.artikel;
    c.appendChild(ar);
  }
  c.appendChild(r);
  box.appendChild(c);
});
</script>
</body>
</html>
